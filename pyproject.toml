[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microframework-apy"
version = "1.0.0"
description = "Micro-framework web asíncrono de alto rendimiento para la generación automatizada de APIs RESTful en Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Herman Geovany Ayala Zúñiga", email = "hayala@uas.edu.mx" },
    { name = "Jesús Emmanuel Hernández Sinsel", email = "sinselemmanuel@gmail.com" },
    { name = "Juan Francisco Figueroa Pérez", email = "juanfco.figueroa@uas.edu.mx" },
    { name = "Rocío Jacqueline Becerra Urquídez", email = "rocio.becerra@uas.edu.mx" },
    { name = "Yobani Martínez Ramírez", email = "yobani@uas.edu.mx" }
]
keywords = ["web", "framework", "rest", "api", "sqlalchemy", "openapi", "swagger", "high-performance", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
    "SQLAlchemy>=2.0.0",
    "greenlet>=3.0.0",
    "typing_extensions>=4.0.0"
]

[project.optional-dependencies]
fast = [
    "orjson>=3.9.0"
]
mysql = [
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0"
]
postgres = [
    "psycopg2-binary>=2.9.9"
]
all = [
    "orjson>=3.9.0",
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
    "psycopg2-binary>=2.9.9"
]

[project.urls]
Homepage = "https://github.com/tesisDrHerman/MicroFrameworkAPY"
Repository = "https://github.com/tesisDrHerman/MicroFrameworkAPY.git"
Issues = "https://github.com/tesisDrHerman/MicroFrameworkAPY/issues"
